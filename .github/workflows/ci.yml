name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs every tool pinned in rokit.toml (rojo, stylua, selene,
      # luau-lsp, lune). GitHub Releases are reachable from Actions runners.
      - name: Install toolchain (Rokit)
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Format check (StyLua)
        run: stylua --check src scene tests

      - name: Lint (Selene)
        run: |
          selene generate-roblox-std
          selene src scene

      - name: DataStore quarantine (only the data layer may touch DataStoreService)
        run: |
          # Structurally enforce the architecture rule: DataStoreService is owned
          # solely by the data layer under src/server/Data/ (the vendored
          # ProfileStore + the ProfileStore-backed adapter). Fail on any reference
          # anywhere else in src.
          matches=$(grep -rnE 'GetService\(\s*["'"'"']DataStoreService["'"'"']\s*\)' src \
            --include='*.luau' | grep -v 'src/server/Data/' || true)
          if [ -n "$matches" ]; then
            echo "::error::DataStoreService accessed outside src/server/Data/:"
            echo "$matches"
            exit 1
          fi
          echo "OK: DataStoreService is quarantined to src/server/Data/"

      - name: Build place (Rojo)
        run: rojo build default.project.json --output build.rbxl

      - name: Type check (luau-lsp)
        run: |
          rojo sourcemap default.project.json --output sourcemap.json
          # Roblox global type definitions MUST be pinned to the luau-lsp version
          # in rokit.toml (JohnnyMorganz/luau-lsp@1.68.1); the definitions syntax
          # tracks the luau-lsp release, so a mismatched file fails to parse. Bump
          # this tag whenever you bump luau-lsp in rokit.toml.
          curl -fsSL "https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.68.1/scripts/globalTypes.d.luau" -o globalTypes.d.luau
          # Vendored ProfileStore is third-party; exclude it from our diagnostics
          # (its types stay resolvable for the adapter that requires it).
          luau-lsp analyze --sourcemap=sourcemap.json --definitions=globalTypes.d.luau --base-luaurc=.luaurc --ignore="**/Data/ProfileStore/**" src

      - name: Unit tests (Lune, headless)
        run: lune run tests/run
